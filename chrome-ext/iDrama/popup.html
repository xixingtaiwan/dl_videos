<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>iDrama Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 420px; min-height: 200px; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; font-size: 13px; }

    .header { background: linear-gradient(135deg, #1e3a5f, #1e293b); padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
    .header-logo { font-size: 17px; font-weight: 800; color: #3b82f6; }
    .header-logo span { color: #fff; }
    .header-badge { margin-left: auto; background: #1d4ed8; color: #bfdbfe; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }

    #drama-info { display: none; padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155; gap: 10px; align-items: center; }
    #drama-info.visible { display: flex; }
    #drama-cover { width: 44px; height: 58px; object-fit: cover; border-radius: 5px; flex-shrink: 0; border: 1px solid #334155; }
    .drama-meta { flex: 1; min-width: 0; }
    .drama-title { font-size: 12px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .drama-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { background: #1d4ed8; color: #bfdbfe; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
    .tag.green { background: #065f46; color: #6ee7b7; }
    .tag.purple { background: #4c1d95; color: #c4b5fd; }

    #not-drama { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; color: #64748b; gap: 10px; }
    #not-drama.visible { display: flex; }
    #not-drama p { font-size: 12px; line-height: 1.6; }

    .controls { padding: 10px 14px; border-bottom: 1px solid #1e293b; display: none; flex-direction: column; gap: 8px; }
    .controls.visible { display: flex; }
    .row { display: flex; gap: 8px; align-items: center; }
    label { font-size: 11px; color: #94a3b8; white-space: nowrap; }
    select, input[type=number] { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: none; flex: 1; }
    select:focus, input:focus { border-color: #3b82f6; }
    .ep-range { display: flex; gap: 6px; align-items: center; }
    .ep-range input[type=number] { width: 58px; flex: none; }
    .ep-range span { color: #64748b; font-size: 11px; }

    .btn { border: none; border-radius: 7px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-size: 12px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 5px; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2563eb; color: #fff; flex: 1; justify-content: center; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-secondary:hover { background: #263347; color: #e2e8f0; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; flex: 1; justify-content: center; }
    .btn-danger:hover { background: #991b1b; }
    .btn-green { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    .btn-green:hover { background: #065f46; }
    .btn-amber { background: #78350f; color: #fcd34d; border: 1px solid #92400e; font-size: 11px; padding: 5px 10px; }
    .btn-amber:hover { background: #92400e; }

    #progress-area { display: none; padding: 8px 14px; border-bottom: 1px solid #1e293b; }
    #progress-area.visible { display: block; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .progress-text { font-size: 11px; color: #94a3b8; }
    .progress-count { font-size: 11px; font-weight: 700; color: #3b82f6; }
    .progress-bar-bg { background: #1e293b; border-radius: 99px; height: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2563eb, #06b6d4); border-radius: 99px; transition: width 0.3s ease; width: 0%; }
    .progress-status { font-size: 10px; color: #475569; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #results-area { display: none; flex-direction: column; }
    #results-area.visible { display: flex; }
    .results-header { padding: 8px 14px 5px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .results-title { font-size: 12px; font-weight: 700; }
    .results-actions { display: flex; gap: 5px; }

    #results-list { max-height: 260px; overflow-y: auto; padding: 4px 8px; }
    #results-list::-webkit-scrollbar { width: 4px; }
    #results-list::-webkit-scrollbar-track { background: #0f172a; }
    #results-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .ep-item { display: flex; align-items: center; gap: 7px; padding: 6px 4px; border-radius: 5px; border-bottom: 1px solid #1e293b; }
    .ep-item:last-child { border-bottom: none; }
    .ep-item:hover { background: #1e293b; }
    .ep-num { background: #1d4ed8; color: #bfdbfe; font-size: 10px; font-weight: 800; min-width: 30px; text-align: center; padding: 2px 3px; border-radius: 4px; flex-shrink: 0; }
    .ep-url { flex: 1; font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
    .ep-url.ok { color: #34d399; }
    .ep-url.error { color: #f87171; }
    .ep-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .ep-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 4px; padding: 3px 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.1s; }
    .ep-btn:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .ep-btn.copy-ok { background: #065f46; border-color: #065f46; color: #6ee7b7; }

    #debug-area { display: none; border-top: 1px solid #1e293b; }
    #debug-area.visible { display: block; }
    #debug-log { max-height: 100px; overflow-y: auto; padding: 6px 10px; font-family: monospace; font-size: 10px; color: #64748b; background: #0a0f1e; }
    #debug-log div { border-bottom: 1px solid #1e293b; padding: 2px 0; word-break: break-all; }

    .footer { padding: 6px 14px; border-top: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .footer-text { color: #334155; font-size: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">iDrama<span>Scraper</span></div>
    <div class="header-badge">v2.0</div>
  </div>

  <div id="not-drama">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#3b82f6" opacity="0.5">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
    </svg>
    <p>Mo trang idrama.dramafren.org va vao trang detail phim.</p>
  </div>

  <div id="drama-info">
    <img id="drama-cover" src="" alt="cover">
    <div class="drama-meta">
      <div class="drama-title" id="drama-title">Dang tai...</div>
      <div class="drama-tags">
        <span class="tag" id="tag-eps">? tap</span>
        <span class="tag green" id="tag-lang">EN</span>
        <span class="tag purple" id="tag-id">ID: ...</span>
      </div>
    </div>
  </div>

  <div class="controls" id="controls-area">
    <div class="row">
      <label>Server:</label>
      <select id="sel-server">
        <option value="1">Server 1</option>
        <option value="2">Server 2</option>
      </select>
      <label>Delay:</label>
      <select id="sel-delay">
        <option value="300">300ms</option>
        <option value="500" selected>500ms</option>
        <option value="800">800ms</option>
        <option value="1200">1.2s</option>
      </select>
    </div>
    <div class="row">
      <label>Tap:</label>
      <div class="ep-range">
        <input type="number" id="ep-from" value="1" min="1" placeholder="Tu">
        <span>to</span>
        <input type="number" id="ep-to" value="1" min="1" placeholder="Den">
      </div>
      <button class="btn btn-secondary" id="btn-all-eps" style="font-size:11px;padding:5px 10px">Tat ca</button>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="btn-scrape">Bat dau Scrape</button>
      <button class="btn btn-danger" id="btn-stop" style="display:none">Dung lai</button>
    </div>
  </div>

  <div id="progress-area">
    <div class="progress-header">
      <span class="progress-text" id="progress-text">Dang scrape...</span>
      <span class="progress-count" id="progress-count">0/0</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
    <div class="progress-status" id="progress-status">Cho bat dau...</div>
  </div>

  <div id="results-area">
    <div class="results-header">
      <span class="results-title"><span id="results-count">0</span> video URLs</span>
      <div class="results-actions">
        <button class="btn btn-secondary" id="btn-copy-all" style="font-size:10px;padding:4px 9px">Copy tat ca</button>
        <button class="btn btn-green" id="btn-export-m3u" style="font-size:10px;padding:4px 9px">M3U</button>
        <button class="btn btn-secondary" id="btn-export-txt" style="font-size:10px;padding:4px 9px">JSON</button>
      </div>
    </div>
    <div id="results-list"></div>
  </div>

  <div id="debug-area">
    <div id="debug-log"></div>
  </div>

  <div class="footer">
    <span class="footer-text">Content script lam fetch - co the dong popup tuy y</span>
    <button class="btn btn-amber" id="btn-debug">Debug</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
